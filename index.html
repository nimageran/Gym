<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#101214">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gym Plan">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Gym Plan</title>
<style>
  :root {
    --bg: #101214; --surface: #181b1f; --raised: #20242a; --line: #2b3038;
    --fg: #eef1f4; --muted: #98a2ad; --accent: #4da6ff; --accent-ink: #06121f;
    --done: #a24cf0; --done-ink: #ffffff; --alert: #c0392b;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: env(safe-area-inset-top, 0) 16px calc(120px + env(safe-area-inset-bottom, 0));
  }
  .wrap { max-width: 1100px; margin: 0 auto; }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:focus-visible, summary:focus-visible, a:focus-visible, input:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }

  /* header */
  header { padding-top: 18px; }
  .tabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    flex: none; background: var(--surface); border: 1px solid var(--line);
    border-radius: 999px; padding: 8px 16px; font-weight: 600; color: var(--muted);
  }
  .tab[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .tab.rest { background: #1f1b2e; border-color: #4a3f73; color: #b9a8ff; border-style: dashed; }
  .tab.rest[aria-selected="true"] { background: #b9a8ff; color: #181326; border-color: #b9a8ff; border-style: solid; }
  .tab.ghost { border-style: dashed; background: transparent; cursor: default; }
  .title { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; margin: 18px 0 10px; flex-wrap: wrap; }
  h1 { margin: 0; font-size: 1.6rem; line-height: 1.15; text-wrap: balance; }
  .sub { color: var(--muted); font-size: .9rem; margin-top: 2px; }
  .reset { background: none; border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; color: var(--muted); font-size: .85rem; }
  .reset.armed { border-color: var(--alert); color: #ff8b7d; }
  .progress { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
  .bar { flex: 1; height: 8px; background: var(--raised); border-radius: 99px; overflow: hidden; }
  .bar > i { display: block; height: 100%; width: 0; background: var(--done); transition: width .25s; }
  .count { font-variant-numeric: tabular-nums; font-size: .9rem; color: var(--muted); min-width: 7.5em; text-align: right; }

  /* exercises */
  .grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); align-items: start; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; min-width: 0; }
  .card.complete {
    background: linear-gradient(160deg, #26123f, #170d29);
    border-color: #b25cff;
    box-shadow: 0 0 0 1px #b25cff, 0 0 14px rgba(178,92,255,.6), 0 0 34px rgba(178,92,255,.3), inset 0 0 22px rgba(178,92,255,.2);
  }
  .card.complete h2 { color: #e2c2ff; text-shadow: 0 0 10px rgba(178,92,255,.8); }
  .card.complete .tally { color: #e2c2ff; }
  .card-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  h2 { margin: 0; font-size: 1.1rem; color: var(--accent); text-wrap: balance; }
  .tally { font-variant-numeric: tabular-nums; color: var(--muted); font-size: .85rem; flex: none; }
  .meta { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
  .chip { background: var(--raised); border-radius: 6px; padding: 2px 9px; font-size: .8rem; color: var(--fg); }
  .cue { color: var(--muted); font-size: .92rem; margin: 6px 0 10px; }
  .video { position: relative; aspect-ratio: 16 / 9; background: #000; border-radius: 10px; overflow: hidden; margin-bottom: 8px; }
  .video iframe, .video button { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .video button { padding: 0; background: #000 center / cover no-repeat; display: grid; place-items: center; border: 0; }
  .video button span { background: rgba(0,0,0,.65); border-radius: 99px; padding: 8px 18px; font-size: .9rem; }
  .sets { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0; }
  .set {
    width: 56px; height: 56px; border-radius: 12px; border: 1px solid var(--line);
    background: var(--raised); font-size: 1.1rem; font-weight: 700; font-variant-numeric: tabular-nums;
  }
  .set[aria-pressed="true"] { background: var(--done); border-color: #c58bff; color: var(--done-ink); box-shadow: 0 0 10px rgba(178,92,255,.6); }
  .fuel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin-bottom: 14px; font-size: .88rem; }
  .fuel-top { display: flex; flex-wrap: wrap; gap: 6px 18px; }
  .fuel b { color: var(--accent); font-weight: 600; }
  .fuel ol { margin: 8px 0 0; padding-left: 1.3em; color: #d3d9df; }
  .fuel .total { margin: 8px 0 0; padding-top: 8px; border-top: 1px solid var(--line); color: var(--muted); font-size: .82rem; }
  .weights { display: flex; flex-wrap: wrap; gap: 8px 16px; }
  .target { font-size: .88rem; color: var(--fg); background: var(--raised); border-radius: 8px; padding: 6px 10px; margin: 6px 0; }
  .target b { color: var(--accent); font-weight: 600; }
  .hint { color: var(--muted); font-size: .82rem; margin-top: 6px; }
  .weight { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: .88rem; }
  .weight input {
    width: 5.5em; background: var(--raised); color: var(--fg); border: 1px solid var(--line);
    border-radius: 8px; padding: 7px 9px; font: inherit;
  }
  .ytlink { display: block; font-size: .8rem; color: var(--muted); margin-bottom: 4px; }
  details { margin-top: 10px; border-top: 1px solid var(--line); padding-top: 4px; }
  summary { cursor: pointer; color: var(--accent); padding: 8px 0; font-size: .92rem; }
  .lvl { margin: 8px 0; font-size: .9rem; color: #d3d9df; }
  .lvl b { display: block; color: var(--accent); font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; }

  /* after the gym */
  h3.section { margin: 28px 0 12px; font-size: 1.2rem; }
  .phase { display: flex; gap: 12px; }
  .phase h4 { margin: 0; font-size: 1.02rem; }
  .when { color: var(--accent); font-size: .8rem; text-transform: uppercase; letter-spacing: .06em; margin: 2px 0 6px; }
  .phase p { margin: 4px 0; font-size: .92rem; }
  .phase p.why { color: var(--muted); }
  .check {
    flex: none; width: 34px; height: 34px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--raised); font-size: 1.1rem; font-weight: 700;
  }
  .check[aria-pressed="true"] { background: var(--done); border-color: var(--done); color: var(--done-ink); }

  /* rest timer */
  #timer {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: #000;
    border-top: 2px solid var(--accent);
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0));
  }
  #timer.go { background: var(--alert); border-color: #ff8b7d; }
  .timer-in { max-width: 1100px; margin: 0 auto; display: flex; align-items: center; gap: 12px; }
  .timer-main { flex: 1; min-width: 0; }
  .timer-label { font-size: .75rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  #timer.go .timer-label { color: #ffd2cc; }
  #clock { font-size: 2.2rem; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
  .tbar { height: 4px; background: var(--raised); border-radius: 9px; margin-top: 6px; overflow: hidden; }
  .tbar i { display: block; height: 100%; background: var(--accent); }
  .tbtn { background: var(--raised); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; font-weight: 600; min-width: 48px; }
  .tbtn.skip { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

  @media (prefers-reduced-motion: reduce) { .bar > i { transition: none; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="tabs" id="tabs" role="tablist" aria-label="Workout days"></div>
    <div class="title">
      <div>
        <h1 id="day-title"></h1>
        <div class="sub" id="day-sub"></div>
      </div>
      <button class="reset" id="reset" type="button">Reset day</button>
    </div>
    <div class="fuel" id="fuel"></div>
    <div class="progress">
      <div class="bar"><i id="bar"></i></div>
      <div class="count" id="count"></div>
    </div>
  </header>
  <main>
    <div id="before"></div>
    <div class="grid" id="exercises"></div>
    <div id="after"></div>
  </main>
</div>

<div id="timer" role="timer" aria-live="off" hidden>
  <div class="timer-in">
    <div class="timer-main">
      <div class="timer-label" id="timer-label">Rest</div>
      <div id="clock">0:00</div>
      <div class="tbar"><i id="tbar"></i></div>
    </div>
    <button class="tbtn" id="minus" type="button" aria-label="Subtract 15 seconds">-15s</button>
    <button class="tbtn" id="plus" type="button" aria-label="Add 15 seconds">+15s</button>
    <button class="tbtn skip" id="skip" type="button">Skip</button>
  </div>
</div>

<script>
/* ---------------------------------------------------------------
   PLAN DATA. To add a day, copy the Day 1 object and add it to DAYS.
   --------------------------------------------------------------- */
const DAYS = [
  {

    tab: "Day 1",
    title: "Width & Traps",

    exercises: [
      { name: "Seated Dumbbell Overhead Press", video: "k6tzKisR3NY", sets: 4, reps: "8-10 reps", rest: 90,

        basic: "Sit on a bench with the back straight up. Press the dumbbells over your head and bring them back down to your ears.",

    else if (k.startsWith("on")) n.addEventListener(k.slice(2), props[k]);

  kids.forEach(c => n.append(c));

}

  }

  const grid = $("exercises"); grid.replaceChildren();
  current.exercises.forEach((ex, i) => {
    const card = el("section", { class: "card", id: "ex" + i });
    const tally = el("span", { class: "tally" });
    card.append(el("div", { class: "card-head" }, [el("h2", { text: (i + 1) + ". " + ex.name }), tally]));
    card.append(el("div", { class: "meta" }, [
      el("span", { class: "chip", text: ex.sets + " sets" }),
      el("span", { class: "chip", text: ex.reps }),
      el("span", { class: "chip", text: ex.rest + "s rest" })
    ]));
    if (ex.target) card.append(el("div", { class: "target" }, [
      el("b", { text: "Target " }), document.createTextNode(ex.target.main + ", drop set " + ex.target.drop)
    ]));
    card.append(el("div", { class: "cue", text: "Cue: " + ex.cue }));

    (ex.videos || (ex.video ? [{ id: ex.video }] : [])).forEach(v => {
      const vid = el("div", { class: "video" });
      const label = v.label ? v.label + " " : "";
      const play = el("button", {
        type: "button", "aria-label": "Play " + label + "demo video for " + ex.name,
        style: "background-image:url(https://i.ytimg.com/vi/" + v.id + "/hqdefault.jpg)",
        onclick: () => {
          vid.replaceChildren(el("iframe", {
            src: "https://www.youtube.com/embed/" + v.id + "?autoplay=1&rel=0",
            title: ex.name + " " + label + "demo", allow: "autoplay; encrypted-media; picture-in-picture", allowfullscreen: ""
          }));
        }
      }, [el("span", { text: "\u25B6 Play " + label + "demo" })]);
      vid.append(play);
      card.append(vid);
      card.append(el("a", { class: "ytlink", href: "https://www.youtube.com/watch?v=" + v.id, target: "_blank", rel: "noopener", text: "Video not playing? Open on YouTube" }));
    });

    const sets = el("div", { class: "sets" });
    st.sets[i].forEach((done, k) => {
      sets.append(el("button", {
        class: "set", type: "button", text: String(k + 1),
        "aria-pressed": String(done), "aria-label": "Set " + (k + 1) + " of " + ex.sets,
        onclick: () => {
          const now = !st.sets[i][k];
          st.sets[i][k] = now; save();
          if (now) startTimer(ex.rest);
          update();
          sets.children[k].setAttribute("aria-pressed", String(now));
        }
      }));
    });
    card.append(sets);

    const w = el("input", {
      type: "text", inputmode: "decimal", id: "w" + i, placeholder: "lbs", value: st.weights[i] || "",
      oninput: e => { st.weights[i] = e.target.value; save(); }
    });
    const wrow = el("div", { class: "weights" }, [
      el("label", { class: "weight", for: "w" + i }, [document.createTextNode("Weight used"), w])
    ]);
    if (ex.dropHint) {
      const dw = el("input", {
        type: "text", inputmode: "decimal", id: "dw" + i, placeholder: "lbs", value: st.drops[i] || "",
        oninput: e => { st.drops[i] = e.target.value; save(); }
      });
      wrow.append(el("label", { class: "weight", for: "dw" + i }, [document.createTextNode("Drop-set weight"), dw]));
    }
    card.append(wrow);
    if (ex.dropHint) card.append(el("div", { class: "hint", text: ex.dropHint }));

    const det = el("details", {}, [el("summary", { text: "How to do it" })]);
    (ex.how ? [["What to do", ex.how]] : [["Basic", ex.basic], ["Intermediate", ex.intermediate], ["Advanced", ex.advanced]]).forEach(([l, t]) =>
      det.append(el("p", { class: "lvl" }, [el("b", { text: l }), document.createTextNode(t)])));
    if (ex.basic || ex.how) card.append(det);

    card._tally = tally;
    grid.append(card);
  });
  if (current.notes) {
    const n = current.notes;
    const card = el("section", { class: "card" }, [el("h2", { text: n.title })]);
    (n.items || [["Basic", n.basic], ["Intermediate", n.intermediate], ["Advanced", n.advanced]]).forEach(([l, t]) =>
      card.append(el("p", { class: "lvl" }, [el("b", { text: l }), document.createTextNode(t)])));
    grid.append(card);
  }

  renderPhases($("before"), current.beforeTitle || "Before the gym", current.before, st.before);
  renderPhases($("after"), "After the gym", current.after, st.after);
  update();
}

function renderPhases(box, heading, list, checked) {
  box.replaceChildren();
  if (!list || !list.length) return;
  box.append(el("h3", { class: "section", text: heading }));
  const g = el("div", { class: "grid" });
  list.forEach((p, i) => {
    const chk = el("button", {
      class: "check", type: "button", text: "\u2713", "aria-label": "Mark " + p.name + " done",
      "aria-pressed": String(!!checked[i]),
      onclick: () => { checked[i] = !checked[i]; save(); chk.setAttribute("aria-pressed", String(!!checked[i])); }
    });
    g.append(el("section", { class: "card phase" }, [chk, el("div", {}, [
      el("h4", { text: p.name }), el("div", { class: "when", text: p.when }),
      el("p", { text: p.what }), el("p", { class: "why", text: p.why })
    ])]));
  });
  box.append(g);
}

function update() {
  const st = dayState(current);
  let done = 0, total = 0;
  current.exercises.forEach((ex, i) => {
    const d = st.sets[i].filter(Boolean).length;
    done += d; total += ex.sets;
    const card = $("ex" + i);
    if (card) {
      card._tally.textContent = d + "/" + ex.sets;
      card.classList.toggle("complete", d === ex.sets);
    }
  });
  document.querySelector(".progress").style.display = total ? "" : "none";
  $("bar").style.width = (total ? done / total * 100 : 0) + "%";
  $("count").textContent = done + " of " + total + " sets" + (done === total && total ? " ✓" : "");
}

/* reset with inline two-step confirm */
let resetTimer;
$("reset").addEventListener("click", e => {
  const b = e.currentTarget;
  if (!b.classList.contains("armed")) {
    b.classList.add("armed"); b.textContent = "Tap again to clear";
    resetTimer = setTimeout(disarm, 3000); return;
  }
  clearTimeout(resetTimer); disarm();
  delete store[current.id]; save(); stopTimer(); render();
});
function disarm() { const b = $("reset"); b.classList.remove("armed"); b.textContent = "Reset day"; }

/* ---------- rest timer (timestamp based, survives screen lock) ---------- */
let endAt = 0, total = 0, tick = null, goUntil = 0, audio;
function beep() {
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    [0, 0.25, 0.5].forEach(t => {
      const o = audio.createOscillator(), g = audio.createGain();
      o.frequency.value = 880; o.connect(g); g.connect(audio.destination);
      g.gain.setValueAtTime(0.25, audio.currentTime + t);
      g.gain.exponentialRampToValueAtTime(0.001, audio.currentTime + t + 0.18);
      o.start(audio.currentTime + t); o.stop(audio.currentTime + t + 0.2);
    });
  } catch (e) {}
  try { navigator.vibrate && navigator.vibrate([250, 100, 250, 100, 250]); } catch (e) {}
}
function startTimer(sec) {
  total = sec; endAt = Date.now() + sec * 1000; goUntil = 0;
  try { audio = audio || new (window.AudioContext || window.webkitAudioContext)(); audio.resume && audio.resume(); } catch (e) {}
  $("timer").hidden = false; $("timer").classList.remove("go");
  $("timer-label").textContent = "Rest";
  clearInterval(tick); tick = setInterval(paint, 250); paint();
}
function paint() {
  const now = Date.now();
  if (goUntil) {
    if (now >= goUntil) return stopTimer();
    return;
  }
  const left = Math.max(0, Math.ceil((endAt - now) / 1000));
  $("clock").textContent = Math.floor(left / 60) + ":" + String(left % 60).padStart(2, "0");
  $("tbar").style.width = Math.min(100, Math.max(0, (endAt - now) / (total * 1000) * 100)) + "%";
  if (left <= 0) {
    $("timer").classList.add("go");
    $("timer-label").textContent = "Next set";
    $("clock").textContent = "GO!";
    goUntil = now + 4000; beep();
  }
}
function stopTimer() { clearInterval(tick); goUntil = 0; $("timer").hidden = true; }
$("skip").addEventListener("click", stopTimer);
$("plus").addEventListener("click", () => { if (!goUntil) { endAt += 15000; total += 15; paint(); } });
$("minus").addEventListener("click", () => { if (!goUntil) { endAt -= 15000; total = Math.max(15, total - 15); paint(); } });
document.addEventListener("visibilitychange", () => { if (!document.hidden && tick) paint(); });

render();
</script>
</body>
